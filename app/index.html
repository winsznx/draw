<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAW capital calls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #E9EDF1;
    --paper: #FFFFFF;
    --ink: #17212B;
    --muted: #5A6775;
    --rule: #CDD5DD;
    --navy: #1D3557;
    --navy-soft: #E3E9F1;
    --funded: #2F6B4E;
    --funded-soft: #E2EFE8;
    --pending: #9A6510;
    --pending-soft: #F6ECDA;
    --overdue: #8A2D3B;
    --overdue-soft: #F4E1E4;
    --sans: "Public Sans", system-ui, sans-serif;
    --serif: "Libre Caslon Text", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.55 var(--sans); font-variant-numeric: tabular-nums; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  .bar { background: var(--paper); border-bottom: 1px solid var(--rule); }
  .bar-inner { max-width: 1080px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  .mark { font-weight: 700; letter-spacing: .02em; font-size: 18px; color: var(--navy); }
  .viewing { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; flex-wrap: wrap; }
  .viewing > span { color: var(--muted); font-size: 14px; }
  .roles { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
  .roles button { border: 0; background: none; padding: 7px 14px; cursor: pointer; border-right: 1px solid var(--rule); font-size: 14px; }
  .roles button:last-child { border-right: 0; }
  .roles button[aria-pressed="true"] { background: var(--navy); color: #fff; font-weight: 600; }
  .network { font-size: 13px; color: var(--muted); }
  .network strong { color: var(--ink); font-weight: 600; }

  main { max-width: 1080px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 4px; font-weight: 700; }
  h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  p { margin: 0 0 12px; max-width: 68ch; }
  .lede { color: var(--muted); margin-bottom: 24px; }

  .btn { border: 1px solid var(--navy); background: var(--navy); color: #fff; border-radius: 5px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn.quiet { background: var(--paper); color: var(--navy); }
  .btn.link { border: 0; background: none; color: var(--navy); padding: 0; text-decoration: underline; font-weight: 500; }

  .panel { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; }
  .admin { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
  .side { display: grid; gap: 20px; }
  .figure { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .figure:last-child { border-bottom: 0; padding-bottom: 0; }
  .figure:first-child { padding-top: 0; }
  .figure span { display: block; color: var(--muted); font-size: 13px; }
  .figure strong { font-size: 26px; font-weight: 600; }
  .figure.funded strong { color: var(--funded); }
  .figure.open strong { color: var(--overdue); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); padding: 0 10px 8px; border-bottom: 1px solid var(--ink); }
  td { padding: 14px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th:first-child, td:first-child { padding-left: 0; }
  td.num, th.num { text-align: right; }
  .sub { display: block; color: var(--muted); font-size: 13px; }
  .when { white-space: nowrap; }
  .row-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .row-actions .btn { padding: 5px 10px; font-size: 13px; }

  .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .s-funded { background: var(--funded-soft); color: var(--funded); }
  .s-submitted, .s-pending, .s-unverified, .s-submitted-late { background: var(--pending-soft); color: var(--pending); }
  .s-overdue { background: var(--overdue-soft); color: var(--overdue); }
  .s-awaiting, .s-waived, .s-review { background: var(--navy-soft); color: var(--navy); }

  .receipt { margin-top: 8px; font-size: 13px; color: var(--muted); border-left: 3px solid var(--funded); padding: 4px 0 4px 10px; }
  .receipt b { color: var(--ink); font-weight: 600; }
  .id { word-break: break-all; }

  .notice { max-width: 640px; margin: 0 auto; background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 1px 0 var(--rule), 0 12px 32px -20px rgba(23, 33, 43, .35); padding: 40px 44px 32px; }
  .letterhead { font-family: var(--serif); font-size: 20px; color: var(--navy); padding-bottom: 14px; border-bottom: 2px solid var(--navy); margin-bottom: 26px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .letterhead small { font-family: var(--sans); font-size: 13px; color: var(--muted); align-self: flex-end; }
  .notice h1 { font-family: var(--serif); font-weight: 400; font-size: 28px; }
  .amount { font-family: var(--serif); font-size: 52px; line-height: 1.1; margin: 22px 0 6px; }
  .terms { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; margin: 22px 0; padding: 16px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 14px; }
  .terms dt { color: var(--muted); }
  .terms dd { margin: 0; }
  .pay { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .other-amount { display: none; gap: 8px; align-items: center; margin-top: 12px; }
  .other-amount.open { display: flex; }
  .other-amount input { width: 110px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px; }
  .wallet { max-width: 640px; margin: 16px auto 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .wallet strong { color: var(--ink); }

  .empty { max-width: 560px; margin: 40px auto; text-align: center; }
  .empty h1 { margin-bottom: 10px; }
  .empty p { margin: 0 auto 16px; color: var(--muted); }

  .form-table input { width: 120px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px; text-align: right; }
  .form-foot { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; margin-top: 16px; }
  .form-foot label { font-size: 14px; color: var(--muted); }
  .form-foot input { width: 64px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px; margin: 0 6px; }

  .provenance { max-width: 1080px; margin: 0 auto; padding: 0 16px 32px; font-size: 13px; color: var(--muted); }
  .provenance p { max-width: none; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: min(560px, calc(100vw - 32px)); background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 6px; font-size: 14px; display: none; }
  .toast.show { display: block; }
  .toast.error { background: var(--overdue); }

  @media (max-width: 820px) {
    .admin { grid-template-columns: 1fr; }
    .notice { padding: 28px 20px 24px; }
    .amount { font-size: 40px; }
    th.hide-sm, td.hide-sm { display: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <span class="mark">DRAW</span>
    <div class="viewing">
      <span id="viewing-label">Viewing as</span>
      <div class="roles" role="group" aria-labelledby="viewing-label">
        <button data-role="admin">Fund admin</button>
        <button data-role="lpA">LP A</button>
        <button data-role="lpB">LP B</button>
        <button data-role="lpC">LP C</button>
        <button data-role="outsider">Unrelated party</button>
      </div>
    </div>
    <span class="network">Network: <strong>__NETWORK__</strong></span>
  </div>
</header>
<main id="view" aria-live="polite"></main>
<footer class="provenance" id="provenance"></footer>
<div class="toast" id="toast" role="status"></div>

<script>
const ROLE_NAME = { admin: 'Fund admin', lpA: 'LP A', lpB: 'LP B', lpC: 'LP C', outsider: 'Unrelated party' };
const STATUS = {
  awaiting: 'Awaiting payment',
  submitted: 'Payment submitted',
  pending: 'Payment pending',
  unverified: 'Settled, awaiting verification',
  funded: 'Funded',
  overdue: 'Overdue',
  'submitted-late': 'Overdue, payment submitted',
  waived: 'Waived',
  review: 'Manual review',
};
const DEFAULT_CALL = [
  { role: 'lpA', scenarioUsd: 400000, units: 40 },
  { role: 'lpB', scenarioUsd: 350000, units: 35 },
  { role: 'lpC', scenarioUsd: 250000, units: 25 },
];

let role = new URLSearchParams(location.search).get('as') || 'admin';
let current = null;
let busy = false;

const usd = (n) => '$' + Number(n).toLocaleString('en-US');
const amt = (n) => Number(n).toLocaleString('en-US', { maximumFractionDigits: 4 });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = (id) => id ? id.slice(0, 14) + '…' : '';
const status = (s) => `<span class="status s-${s}">${STATUS[s] ?? s}</span>`;

function due(iso) {
  const at = new Date(iso);
  const minutes = Math.round((at - Date.now()) / 60000);
  const rel = minutes > 0 ? `in ${minutes} min` : minutes === 0 ? 'now' : `${-minutes} min ago`;
  return `<span class="when">${at.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span> <span class="sub">${rel}</span>`;
}
const isPastDue = (iso) => new Date(iso) <= Date.now();

function toast(message, isError) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.className = 'toast'; }, isError ? 9000 : 5000);
}

async function act(name, body, button) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('main button').forEach((b) => { b.disabled = true; });
  if (button) button.textContent = 'Working on the ledger…';
  try {
    const res = await fetch('/api/actions/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const data = await res.json();
    if (!res.ok) toast('The ledger refused this: ' + data.error, true);
    else toast(data.message);
  } catch (e) {
    toast('Could not reach the DRAW server. Is it running?', true);
  } finally {
    busy = false;
    await load();
  }
}

// ---------------------------------------------------------------- admin
function adminView(v) {
  if (!v.session) {
    return `<div class="empty">
      <h1>Start a demo fund</h1>
      <p>This creates a fund admin, three investors, and an unrelated party on ${esc(v.network)}, each with its own ledger login. Investors get test Amulet and an invitation to commit.</p>
      <button class="btn" data-act="setup">Create demo fund</button>
    </div>`;
  }
  const accepted = new Set(v.commitments.map((c) => c.investor));
  const waiting = DEFAULT_CALL.filter((r) => !accepted.has(r.role));

  if (!v.call) {
    return `<h1>${esc(v.fund?.name)}</h1>
      <p class="lede">No capital has been called yet.</p>
      <div class="admin">
        <section class="panel">
          <h2>Issue a capital call</h2>
          <table class="form-table">
            <thead><tr><th>Investor</th><th class="num hide-sm">Committed</th><th class="num">Amount called</th><th class="num">Settles in Amulet</th></tr></thead>
            <tbody>${DEFAULT_CALL.map((r) => {
              const c = v.commitments.find((x) => x.investor === r.role);
              return `<tr><td>${ROLE_NAME[r.role]}${c ? '' : '<span class="sub">Has not accepted yet</span>'}</td>
                <td class="num hide-sm">${c ? usd(c.committedUsd) : ''}</td>
                <td class="num"><input aria-label="Amount called from ${ROLE_NAME[r.role]}" data-usd="${r.role}" value="${r.scenarioUsd}" inputmode="numeric"></td>
                <td class="num"><input aria-label="Amulet for ${ROLE_NAME[r.role]}" data-units="${r.role}" value="${r.units}" inputmode="decimal"></td></tr>`;
            }).join('')}</tbody>
          </table>
          <div class="form-foot">
            <label>Due in<input id="due-minutes" value="3" inputmode="numeric">minutes</label>
            <button class="btn" data-act="issue" ${waiting.length ? 'disabled' : ''}>Issue capital call</button>
          </div>
          ${waiting.length ? `<p class="sub" style="margin-top:12px">Waiting for ${waiting.map((r) => ROLE_NAME[r.role]).join(', ')} to accept. Switch to each investor to accept.</p>` : ''}
        </section>
        <aside class="side"><section class="panel">${commitmentList(v)}</section></aside>
      </div>`;
  }

  return `<h1>${esc(v.fund?.name)}</h1>
    <p class="lede">${esc(v.call.description)}, due ${new Date(v.call.dueAt).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>
    <div class="admin">
      <section class="panel">
        <h2>Investor obligations</h2>
        <table>
          <thead><tr><th>Investor</th><th class="num">Called</th><th class="hide-sm">Due</th><th>Status</th><th></th></tr></thead>
          <tbody>${v.obligations.map(adminRow).join('')}</tbody>
        </table>
      </section>
      <aside class="side">
        <section class="panel">
          <div class="figure"><span>Called</span><strong>${usd(v.call.totalUsd)}</strong></div>
          <div class="figure funded"><span>Funded and verified</span><strong>${usd(v.totals.fundedUsd)}</strong></div>
          <div class="figure open"><span>Still unresolved</span><strong>${usd(v.totals.unresolvedUsd)}</strong></div>
          <div class="figure"><span>Amulet received</span><strong>${amt(v.totals.fundedUnits)}</strong></div>
        </section>
        <section class="panel">${commitmentList(v)}</section>
      </aside>
    </div>`;
}

function commitmentList(v) {
  return `<h2>Commitments</h2>${DEFAULT_CALL.map((r) => {
    const c = v.commitments.find((x) => x.investor === r.role);
    return `<div class="figure"><span>${ROLE_NAME[r.role]}</span>${c ? `${usd(c.committedUsd)} <span class="sub">${usd(c.calledUsd)} called</span>` : '<span class="sub">Invitation not accepted</span>'}</div>`;
  }).join('')}
  <p style="margin:16px 0 0"><button class="btn link" data-act="reset">Start over with a new fund</button></p>`;
}

function adminRow(o) {
  const actions = [];
  if (o.status !== 'funded') {
    for (const a of o.allocations) {
      actions.push(`<button class="btn" data-act="settle" data-ref="${esc(o.ref)}" data-allocation="${esc(a.allocationCid)}">Settle ${amt(a.amount)} from ${ROLE_NAME[a.from] ?? 'unknown'}</button>`);
    }
    if (!o.allocations.length && (o.status === 'awaiting') && isPastDue(o.dueAt)) {
      actions.push(`<button class="btn quiet" data-act="overdue" data-ref="${esc(o.ref)}">Mark overdue</button>`);
    }
  }
  return `<tr>
    <td>${ROLE_NAME[o.investor]}<span class="sub when">${amt(o.units)} Amulet</span></td>
    <td class="num">${usd(o.scenarioUsd)}</td>
    <td class="hide-sm">${due(o.dueAt)}</td>
    <td>${status(o.status)}${receipt(o)}</td>
    <td><div class="row-actions">${actions.join('')}</div></td>
  </tr>`;
}

function receipt(o) {
  if (!o.receipt) return '';
  return `<div class="receipt">Verifier ${o.receipt.verdict === 'VERIFIED_FUNDED' ? 'confirmed' : 'did not confirm'} ${amt(o.receipt.receivedAmount)} Amulet received, ${o.receipt.passed} of ${o.receipt.checks} checks. <span class="sub id">Update ${short(o.receipt.updateId)}</span></div>`;
}

// ---------------------------------------------------------------- investor
function lpView(v) {
  if (!v.session) return emptyNoFund();
  const name = ROLE_NAME[v.role];
  const wallet = `<div class="wallet"><span>Your Amulet balance: <strong>${amt(v.balance ?? 0)}</strong></span><button class="btn link" data-act="faucet">Add test Amulet</button></div>`;

  const invitation = v.invitations[0];
  if (invitation) {
    return `<article class="notice">
      <div class="letterhead">${esc(invitation.fundName)}<small>For ${name}</small></div>
      <h1>Invitation to commit</h1>
      <p>You are invited to commit capital to ${esc(invitation.fundName)}. The fund may call this capital over time. Only you and the fund admin can see this commitment.</p>
      <div class="amount">${usd(invitation.committedUsd)}</div>
      <p class="sub">Commitment</p>
      <div class="pay" style="margin-top:24px"><button class="btn" data-act="accept">Accept commitment</button></div>
    </article>${wallet}`;
  }

  const o = v.obligations[0];
  if (!o) {
    const c = v.commitments[0];
    return `<div class="empty"><h1>${c ? 'No capital called yet' : 'Nothing for you here yet'}</h1>
      <p>${c ? `You have committed ${usd(c.committedUsd)} to ${esc(v.fundName)}. Calls will appear here.` : 'The fund admin has not invited this investor.'}</p></div>${wallet}`;
  }

  const open = o.status !== 'funded' && o.status !== 'unverified' && o.status !== 'waived';
  const submitted = o.allocations;
  return `<article class="notice">
    <div class="letterhead">${esc(o.fundName)}<small>For ${name}</small></div>
    <h1>Capital call notice</h1>
    <div class="amount">${usd(o.scenarioUsd)}</div>
    <p class="sub">Your share of this call</p>
    <dl class="terms">
      <dt>Settle with</dt><dd>${amt(o.units)} Amulet to the fund</dd>
      <dt>Due</dt><dd>${due(o.dueAt)}</dd>
      <dt>Status</dt><dd>${status(o.status)}</dd>
      <dt>Reference</dt><dd class="id">${esc(o.ref)}</dd>
    </dl>
    ${o.status === 'funded' ? receipt(o) : ''}
    ${open && !submitted.length ? `<div class="pay">
        <button class="btn" data-act="pay">Pay ${amt(o.units)} Amulet</button>
        <button class="btn link" data-toggle-other>Pay a different amount</button>
      </div>
      <div class="other-amount" id="other-amount">
        <input id="other-value" inputmode="decimal" value="${amt(Math.max(o.units - 5, 1))}" aria-label="Amount in Amulet">
        <button class="btn quiet" data-act="pay-other">Pay this amount</button>
        <span class="sub">The fund will refuse anything but the exact amount.</span>
      </div>` : ''}
    ${submitted.map((a) => `<p>You locked ${amt(a.amount)} Amulet for this call. The fund admin settles it.
      <button class="btn link" data-act="withdraw" data-allocation="${esc(a.allocationCid)}">Withdraw it</button></p>`).join('')}
  </article>${wallet}`;
}

function emptyNoFund() {
  return `<div class="empty"><h1>No fund yet</h1><p>Switch to the fund admin to create the demo fund.</p></div>`;
}

function outsiderView(v) {
  if (!v.session) return emptyNoFund();
  const seen = v.obligations.length + v.commitments.length + v.invitations.length + (v.fund ? 1 : 0) + (v.call ? 1 : 0);
  return `<div class="empty">
    <h1>${seen ? 'This party can see fund data' : 'The ledger returned nothing'}</h1>
    <p>${seen ? 'This should not happen. Check the visibility evidence.' : 'This party is on the same network as the fund, but it is not a signatory or observer on any fund, call, commitment, or obligation, so its ledger queries come back empty.'}</p>
  </div>`;
}

// ---------------------------------------------------------------- shell
function render(v) {
  current = v;
  document.querySelectorAll('.roles button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.role === role)));
  const view = document.getElementById('view');
  const openOther = document.getElementById('other-amount')?.classList.contains('open');
  view.innerHTML = role === 'admin' ? adminView(v) : role === 'outsider' ? outsiderView(v) : lpView(v);
  if (openOther) document.getElementById('other-amount')?.classList.add('open');
  document.getElementById('provenance').innerHTML = v.queriedAs
    ? `<p>Everything above was read from the ledger with ${esc(ROLE_NAME[role])}'s own login: user <span class="id">${esc(v.queriedAs.userId)}</span>, party <span class="id">${esc(short(v.queriedAs.party))}</span>. Dollar amounts are the business scenario. Amulet amounts are what moves on ${esc(v.network)}. Funded means an independent read-only verifier confirmed the settlement.</p>`
    : '';
}

async function load() {
  try {
    const res = await fetch('/api/view?role=' + role);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    if (!busy) render(data);
  } catch (e) {
    document.getElementById('view').innerHTML = `<div class="empty"><h1>Could not read the ledger</h1><p>${esc(e.message)}</p></div>`;
  }
}

document.querySelector('.roles').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  role = b.dataset.role;
  history.replaceState(null, '', '?as=' + role);
  document.getElementById('view').innerHTML = `<div class="empty"><p>Reading the ledger as ${ROLE_NAME[role]}…</p></div>`;
  load();
});

document.getElementById('view').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-toggle-other')) { document.getElementById('other-amount').classList.toggle('open'); return; }
  const name = b.dataset.act;
  if (!name) return;
  if (name === 'setup') return act('setup', {}, b);
  if (name === 'reset') return act('reset', {}, b);
  if (name === 'issue') {
    const rows = DEFAULT_CALL.map((r) => ({
      role: r.role,
      scenarioUsd: Number(document.querySelector(`[data-usd="${r.role}"]`).value),
      units: Number(document.querySelector(`[data-units="${r.role}"]`).value),
    }));
    return act('issue', { rows, dueMinutes: Number(document.getElementById('due-minutes').value) }, b);
  }
  if (name === 'settle') return act('settle', { ref: b.dataset.ref, allocationCid: b.dataset.allocation }, b);
  if (name === 'overdue') return act('overdue', { ref: b.dataset.ref }, b);
  if (name === 'pay') return act('pay', { role }, b);
  if (name === 'pay-other') return act('pay', { role, amount: Number(document.getElementById('other-value').value) }, b);
  if (name === 'withdraw') return act('withdraw', { role, allocationCid: b.dataset.allocation }, b);
  if (name === 'accept' || name === 'faucet') return act(name, { role }, b);
});

load();
setInterval(() => { if (!busy && !document.activeElement?.matches('input')) load(); }, 4000);
</script>
</body>
