# One service: the DRAW app. Configuration and secrets come from ../.env on the
# server, never from the image. The volume keeps receipts and the session.
services:
  draw:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - draw-evidence:/draw/evidence
      - draw-state:/draw/app/state
    restart: unless-stopped
volumes:
  draw-evidence:
  draw-state:
