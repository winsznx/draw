# Ceiling for README, UI, video, and submission text. Statuses follow evidence.
claims:
  - id: private-obligations
    text: "Each LP can read only its own capital-call obligation and commitment. Other LPs and unrelated parties cannot read it, even with its contract id."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/visibility-after-issue.json
      - evidence/local/runs/20261001T162427Z/visibility-final.json
    limits: "All LPs share one participant on LocalNet. The participant operator can see all hosted parties. In production each LP would use its own validator." 

  - id: settlement-gates-funded
    text: "An obligation becomes funded only in the transaction that executes a CIP-0056 allocation carrying its reference, from its LP, to the fund admin, for the exact amount and instrument."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/mutation/20261001T160135Z/result.json
      - evidence/local/runs/20261001T162427Z/receipt-lpA.json
      - evidence/local/runs/20261001T162427Z/receipt-lpB.json

  - id: negative-settlement
    text: "Wrong amount, wrong sender, wrong reference, wrong call, wrong executor, wrong instrument, and replay do not fund an obligation."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/result.json
    limits: "LocalNet covers wrong amount, wrong payer, wrong reference, and replay. Wrong executor, wrong call, and wrong instrument are Daml Script only." 

  - id: unpaid-unresolved
    text: "An LP that does not pay stays unresolved, and can be marked overdue only after the due time."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/result.json
    limits: "Overdue is set by an admin action after the deadline. There is no scheduler." 

  - id: admin-totals
    text: "Admin funded and unresolved totals equal the sum of the underlying obligations and the admin's received holdings."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/totals.json

  - id: real-token-settlement
    text: "A real Amulet (Canton Coin on LocalNet) allocation settles an obligation, and a separate read-only verifier credential reads the result back before it counts as funded."
    status: local_verified
    environments: [localnet]
    evidence:
      - evidence/local/runs/20261001T162427Z/receipt-lpA.json
      - evidence/local/runs/20261001T162427Z/receipt-lpB.json
    limits: "LocalNet DevNet-tap Amulet, 40 and 35 units. Not DevNet, not MainNet." 

  - id: devnet
    text: "DRAW runs end-to-end on HackCanton DevNet."
    status: blocked
    environments: []
    evidence: []
    blocker: BLOCKED_ON_HUMAN, no AppsFactory or NODERS DevNet credentials

  - id: grofty
    text: "An LP funds an obligation through Grofty on MainNet."
    status: blocked
    environments: []
    evidence: []
    blocker: out of scope this pass, see docs/DECISIONS.md D-001
