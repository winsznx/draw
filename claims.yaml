# Ceiling for README, UI, deck, video, materials, and submission text. Statuses follow evidence.
# LocalNet and DevNet claims stay separate. On DevNet the demo seats share one credential: one hackathon login
# in the earlier runs, the backend client NODERS issued for DRAW since 2026-10-06. In the external-party run
# 20261007T130259Z each party signs with its own key, held on the machine that ran it.
claims:
  - id: private-obligations
    text: "Each LP can read only its own capital-call obligation and commitment. Other LPs and unrelated parties cannot read it, even with its contract id."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/visibility-after-issue.json
      - evidence/local/runs/20261001T162427Z/visibility-final.json
      - evidence/local/campaign/20261002T193724Z/result.json
    limits: "Checked here with a separate ledger login per party. All LPs share one participant on LocalNet, and the participant operator can see all hosted parties. In production each LP would use its own validator. The DevNet party-scoped reads and transaction streams are part of the devnet claim."

  - id: settlement-gates-funded
    text: "An obligation becomes funded only in the transaction that executes a CIP-0056 allocation carrying its reference, from its LP, to the fund admin, for the exact amount and instrument. Each settlement receipt records 14 checks. On package 0.3.0, each of 15 deliberately broken guards is caught by the Daml tests."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/mutation/20261001T160135Z/result.json
      - evidence/local/daml_core/20261002T192910Z/result.json
      - evidence/local/mutation/20261002T192939Z/result.json
      - evidence/local/daml_core/20261006T081605Z/result.json
      - evidence/local/mutation/20261006T081625Z/result.json
      - evidence/local/runs/20261001T162427Z/receipt-lpA.json
      - evidence/local/runs/20261001T162427Z/receipt-lpB.json
    limits: "Run with Amulet on LocalNet. The DevNet settlement with Canton Coin is part of the devnet claim. The USDCx registry's public metadata lists the same allocation API (splice-api-token-allocation-v1), but DRAW has not run with USDCx."

  - id: negative-settlement
    text: "Wrong amount, wrong sender, wrong reference, wrong call, wrong executor, wrong instrument, and replay do not fund an obligation."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/result.json
      - evidence/local/campaign/20261002T193724Z/result.json
    limits: "LocalNet covers wrong amount, wrong payer, wrong reference, and replay. Wrong executor, wrong call, and wrong instrument are Daml Script only. The same four refusals on DevNet are part of the devnet claim."

  - id: unpaid-unresolved
    text: "An LP that does not pay stays unresolved, and can be marked overdue only after the due time."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/result.json
    limits: "Overdue is set by an admin action after the deadline. There is no scheduler. The DevNet overdue checks are part of the devnet claim."

  - id: admin-totals
    text: "Admin funded and unresolved totals equal the sum of the underlying obligations and the admin's received holdings."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/totals.json

  - id: real-token-settlement
    text: "On LocalNet, an Amulet allocation settles an obligation (Amulet is the Splice token implementation behind Canton Coin), and a separate read-only verifier login reads the result back before it counts as funded. In the run measured for timing, payment locked to verified funded took 1,047 ms for LP A and 1,037 ms for LP B, and the three-LP call took 15 ledger transactions including setup, with one transaction to issue the call to every LP."
    status: local_verified
    environments: [localnet]
    evidence:
      - evidence/local/runs/20261001T162427Z/receipt-lpA.json
      - evidence/local/runs/20261001T162427Z/receipt-lpB.json
      - evidence/local/workload/20261002T185353Z/result.json
    limits: "LocalNet Amulet from the DevNet-style tap, 40 and 35 units. The 1,047 ms comes from single-machine LocalNet with a scripted admin acting at once, so it says nothing about production latency. The DevNet settlement is the devnet claim. Not MainNet, no real money."

  - id: devnet
    text: "DRAW runs end to end on the HackCanton DevNet node, passing 82 of 82 checks on package 0.3.0. The demo seats act through a backend client NODERS issued for DRAW, which the node reports as holding rights on the five demo parties and nothing else. The read-back step uses a separate client, which the node reports as able only to read as the fund: the run tried to submit as the fund with it, and the ledger refused. Canton Coin from the DevNet faucet settles two LPs' obligations, each in the transaction that executes its allocation, and the read-back step confirms each settlement with a 14-check receipt, recorded as read by its own ledger user, before it counts. A wrong amount, wrong payer, wrong reference and replayed payment are refused, overdue is refused before the due time, and the unpaid LP goes overdue after it. The fund's totals match the coin it received, and each party's view and transaction history contain only its own records. The read-back receipts are stamped 7.5 seconds (LP A) and 5.2 seconds (LP B) after the settlements' record times."
    status: devnet_verified
    environments: [devnet]
    evidence:
      - evidence/devnet/runs/20261007T125638Z/result.json
      - evidence/devnet/runs/20261007T125638Z/receipt-lpA.json
      - evidence/devnet/runs/20261007T125638Z/receipt-lpB.json
      - evidence/devnet/runs/20261007T125638Z/streams.json
      - evidence/devnet/runs/20261007T125638Z/totals.json
      - evidence/devnet/probes/20261007T125624Z/result.json
    limits: "One backend client acts for all five demo parties, so LP-from-LP credential separation was not tested in this run (it was on LocalNet), and that check was skipped with the reason recorded. Probe 20261007T125624Z records the verifier client reading only as the fund. The earlier probe 20261006T133219Z found it could also act and read as the team's personal wallet party, and NODERS removed that on 2026-10-07. The DevNet run in which each party signs with its own key is the devnet-own-keys claim. Party-scoped reads, transaction streams, and settlement were tested. Wrong executor, wrong call, and wrong instrument were not run on DevNet. Canton Coin from the DevNet faucet has no monetary value, and the dollar figures are the scenario. Per the Splice Scan API docs, the Canton Coin leg of each payment involves the DSO and appears in Scan, with its random reference and the party ids, whose hints such as draw-lpa are readable, while the obligation contracts don't. That is inferred from the docs and has not been checked against Scan. The 7.5 and 5.2 seconds compare the verifier's clock with the ledger's record time. Earlier DevNet runs: 82 of 82 in evidence/devnet/runs/20261006T131900Z, while the verifier client could still act for the team's personal party, and with one shared hackathon login for every party and the read-back, 72 of 72 on package 0.2.0 (evidence/devnet/runs/20261004T120110Z) and 79 of 79 on 0.3.0 (evidence/devnet/runs/20261006T091531Z)."

  - id: wallet-request
    text: "Each LP's capital call also reaches it as a CIP-0056 AllocationRequest, the Token Standard interface an app uses to ask a user for an allocation, naming the settlement, payer, receiver, amount and instrument. Other LPs and outsiders can't see it. On DevNet, LP A's request matched its notice field by field, and LP A paid by creating the allocation from that request, the same factory call a wallet makes, and the request closed when the call settled."
    status: devnet_verified
    environments: [daml-script, devnet]
    evidence:
      - evidence/devnet/runs/20261007T130259Z/result.json
      - evidence/devnet/runs/20261007T125638Z/result.json
      - evidence/devnet/runs/20261006T131900Z/result.json
      - evidence/devnet/runs/20261006T091531Z/result.json
      - evidence/local/daml_core/20261006T081605Z/result.json
    limits: "In run 20261007T130259Z LP A's own key signed its allocation. In the other runs the script created it through the demo seats' shared credential: the backend client in runs 20261007T125638Z and 20261006T131900Z, the shared hackathon login in run 20261006T091531Z. LP B paid with a plain allocation carrying the reference, which settles the same way. A wallet listing and approving a DRAW request is the signed-in-lp claim."

  - id: verifier-party
    text: "A fund can name a verifier party. It can read the fund, every call and every obligation, including the settled amount, and LP privacy is unchanged. When it tries to act on an obligation or the fund, the ledger refuses."
    status: local_verified
    environments: [daml-script]
    evidence: [evidence/local/daml_core/20261006T081605Z/result.json]
    limits: "Daml Script only. On DevNet the read-back step reads as the fund's own party: through the verifier client in runs 20261006T131900Z and 20261007T125638Z and on the live site since about 13:00 UTC on 2026-10-07, through the backend client on the live site before that, and through the team's login in run 20261007T130259Z."

  - id: signed-in-lp
    text: "On the deployed site, an LP with its own HackCanton login joins a demo fund as itself. It signs in on the node's Keycloak from the browser, its browser reads its notices from the ledger with its own token, and it accepts its commitment with that login. It pays from its own Canton wallet, either from DRAW, which calls the wallet's allocate API, or by pressing Accept on the request in the node's Canton Coin wallet. The fund manager settles, and the LP's notice shows verified funded once the read-back step confirms it. DRAW's server learns only the LP's party id and never receives its token. In the newest runs the server's ledger credentials were a backend client with rights on the five demo parties and nothing else and, in the two newest, a verifier client that only reads as the fund, so nothing the server held could act for the LP's party."
    status: devnet_verified
    environments: [devnet]
    evidence:
      - evidence/devnet/browser/web-hackcanton-20261008221025/result.json
      - evidence/devnet/browser/web-hackcanton-20261007215349/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261007215129/result.json
      - evidence/devnet/browser/web-hackcanton-20261007130106/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261007130229/result.json
      - evidence/devnet/probes/20261007T125624Z/result.json
      - evidence/devnet/browser/web-hackcanton-20261007015511/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261007015632/result.json
      - evidence/devnet/browser/web-hackcanton-20261006132613/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261006132730/result.json
      - evidence/devnet/probes/20261006T133219Z/result.json
      - evidence/devnet/browser/web-hackcanton-20261006100912/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261006101052/result.json
      - evidence/devnet/browser/web-hackcanton-20261006111458/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261006111654/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261006114558/result.json
    limits: "The nine newest runs record the site's setup: the demo seats on the backend client and DRAW's own Keycloak client for sign-in. The four newest, from 13:01 UTC on 2026-10-07, also read back on a client of its own, the two newest of them on drawcalls.xyz, which probe 20261007T125624Z records as reading only as the fund. The four before them read back on the backend client, two of them on the release whose screens say so. The backend client's rights come from probe 20261006T133219Z, which records its check passing and the verifier client's failing, and the team's personal login was removed from the server before those runs. Earlier runs used a server that also held the team's personal login, which could act for the LP's party. Every run but the newest signed in with the team's personal login as the LP. The newest, web-hackcanton-20261008221025 on drawcalls.xyz, signed in with xidoncapitals-t1, a second login NODERS created for the team, whose party is not the team's personal party. The team ran it too, so the LP's login and party were separate from the team's personal ones but the people were not, and no outside LP has used it. The verifier client NODERS issued could also act for that personal party until NODERS removed that right on 2026-10-07, and it went on the server only after. The LP's party is its login's wallet party, on the same NODERS participant as the fund, which has DRAW's package vetted. The token stays in the browser tab's session storage. The first four runs signed in through NODERS' public web-app client, the later ones through DRAW's own client. The runs from 11:14 UTC on are on the release where Sign out also ends the Keycloak session and every sign-in asks for the password."

