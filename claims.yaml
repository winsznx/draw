# Ceiling for README, UI, deck, video, materials, and submission text. Statuses follow evidence.
# LocalNet and DevNet claims stay separate. On DevNet one hackathon login acts for every party.
claims:
  - id: private-obligations
    text: "Each LP can read only its own capital-call obligation and commitment. Other LPs and unrelated parties cannot read it, even with its contract id."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/visibility-after-issue.json
      - evidence/local/runs/20261001T162427Z/visibility-final.json
      - evidence/local/campaign/20261002T193724Z/result.json
    limits: "Checked here with a separate ledger login per party. All LPs share one participant on LocalNet, and the participant operator can see all hosted parties. In production each LP would use its own validator. The DevNet party-scoped reads and transaction streams are part of the devnet claim."

  - id: settlement-gates-funded
    text: "An obligation becomes funded only in the transaction that executes a CIP-0056 allocation carrying its reference, from its LP, to the fund admin, for the exact amount and instrument. Each settlement receipt records 14 checks. On package 0.3.0, each of 15 deliberately broken guards is caught by the Daml tests."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/mutation/20261001T160135Z/result.json
      - evidence/local/daml_core/20261002T192910Z/result.json
      - evidence/local/mutation/20261002T192939Z/result.json
      - evidence/local/daml_core/20261006T081605Z/result.json
      - evidence/local/mutation/20261006T081625Z/result.json
      - evidence/local/runs/20261001T162427Z/receipt-lpA.json
      - evidence/local/runs/20261001T162427Z/receipt-lpB.json
    limits: "Run with Amulet on LocalNet. The DevNet settlement with Canton Coin is part of the devnet claim. The USDCx registry's public metadata lists the same allocation API (splice-api-token-allocation-v1), but DRAW has not run with USDCx."

  - id: negative-settlement
    text: "Wrong amount, wrong sender, wrong reference, wrong call, wrong executor, wrong instrument, and replay do not fund an obligation."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/result.json
      - evidence/local/campaign/20261002T193724Z/result.json
    limits: "LocalNet covers wrong amount, wrong payer, wrong reference, and replay. Wrong executor, wrong call, and wrong instrument are Daml Script only. The same four refusals on DevNet are part of the devnet claim."

  - id: unpaid-unresolved
    text: "An LP that does not pay stays unresolved, and can be marked overdue only after the due time."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/result.json
    limits: "Overdue is set by an admin action after the deadline. There is no scheduler. The DevNet overdue checks are part of the devnet claim."

  - id: admin-totals
    text: "Admin funded and unresolved totals equal the sum of the underlying obligations and the admin's received holdings."
    status: local_verified
    environments: [daml-script, localnet]
    evidence:
      - evidence/local/daml_core/20261001T160054Z/result.json
      - evidence/local/runs/20261001T162427Z/totals.json

  - id: real-token-settlement
    text: "On LocalNet, an Amulet allocation settles an obligation (Amulet is the Splice token implementation behind Canton Coin), and a separate read-only verifier login reads the result back before it counts as funded. In the run measured for timing, payment locked to verified funded took 1,047 ms for LP A and 1,037 ms for LP B, and the three-LP call took 15 ledger transactions including setup, with one transaction to issue the call to every LP."
    status: local_verified
    environments: [localnet]
    evidence:
      - evidence/local/runs/20261001T162427Z/receipt-lpA.json
      - evidence/local/runs/20261001T162427Z/receipt-lpB.json
      - evidence/local/workload/20261002T185353Z/result.json
    limits: "LocalNet Amulet from the DevNet-style tap, 40 and 35 units. The 1,047 ms comes from single-machine LocalNet with a scripted admin acting at once, so it says nothing about production latency. The DevNet settlement is the devnet claim. Not MainNet, no real money."

  - id: devnet
    text: "DRAW runs end to end on the HackCanton DevNet node, passing 82 of 82 checks on package 0.3.0. The demo seats act through a backend client NODERS issued for DRAW, which the node reports as holding rights on the five demo parties and nothing else. The read-back step uses a separate client: the run tried to submit as the fund with it, and the ledger refused. Canton Coin from the DevNet faucet settles two LPs' obligations, each in the transaction that executes its allocation, and the read-back step confirms each settlement with a 14-check receipt, recorded as read by its own ledger user, before it counts. A wrong amount, wrong payer, wrong reference and replayed payment are refused, overdue is refused before the due time, and the unpaid LP goes overdue after it. The fund's totals match the coin it received, and each party's view and transaction history contain only its own records."
    status: devnet_verified
    environments: [devnet]
    evidence:
      - evidence/devnet/runs/20261006T131900Z/result.json
      - evidence/devnet/runs/20261006T131900Z/receipt-lpA.json
      - evidence/devnet/runs/20261006T131900Z/receipt-lpB.json
      - evidence/devnet/runs/20261006T131900Z/streams.json
      - evidence/devnet/runs/20261006T131900Z/totals.json
      - evidence/devnet/probes/20261006T133219Z/result.json
    limits: "One backend client acts for all five demo parties, so LP-from-LP credential separation was not tested on DevNet (it was on LocalNet), and that check was skipped with the reason recorded. The verifier's client is not read-only: probe 20261006T133219Z records it failing that check, because it can also act and read as the team's personal wallet party, which NODERS has been asked to remove. It cannot act as the fund, which is what the run tested. Party-scoped reads, transaction streams, and settlement were tested. Wrong executor, wrong call, and wrong instrument were not run on DevNet. Canton Coin from the DevNet faucet has no monetary value, and the dollar figures are the scenario. Per the Splice Scan API docs, the Canton Coin leg of each payment involves the DSO and appears in Scan, with its random reference and the party ids, whose hints such as draw-lpa are readable, while the obligation contracts don't. That is inferred from the docs and has not been checked against Scan. Earlier DevNet runs used one shared hackathon login for every party and the read-back: 72 of 72 on package 0.2.0 (evidence/devnet/runs/20261004T120110Z) and 79 of 79 on 0.3.0 (evidence/devnet/runs/20261006T091531Z)."

  - id: wallet-request
    text: "Each LP's capital call also reaches it as a CIP-0056 AllocationRequest, the Token Standard interface an app uses to ask a user for an allocation, naming the settlement, payer, receiver, amount and instrument. Other LPs and outsiders can't see it. On DevNet, LP A's request matched its notice field by field, and LP A paid by creating the allocation from that request, the same factory call a wallet makes, and the request closed when the call settled."
    status: devnet_verified
    environments: [daml-script, devnet]
    evidence:
      - evidence/devnet/runs/20261006T091531Z/result.json
      - evidence/local/daml_core/20261006T081605Z/result.json
    limits: "The run script created LP A's allocation with the shared hackathon login. LP B paid with a plain allocation carrying the reference, which settles the same way. A wallet listing and approving a DRAW request is the signed-in-lp claim."

  - id: verifier-party
    text: "A fund can name a verifier party. It can read the fund, every call and every obligation, including the settled amount, and LP privacy is unchanged. When it tries to act on an obligation or the fund, the ledger refuses."
    status: local_verified
    environments: [daml-script]
    evidence: [evidence/local/daml_core/20261006T081605Z/result.json]
    limits: "Daml Script only. On DevNet the read-back step reads as the fund's own party with the shared login, until a separate verifier login exists."

  - id: signed-in-lp
    text: "On the deployed site, an LP with its own HackCanton login joins a demo fund as itself. It signs in on the node's Keycloak from the browser, its browser reads its notices from the ledger with its own token, and it accepts its commitment with that login. It pays from its own Canton wallet, either from DRAW, which calls the wallet's allocate API, or by pressing Accept on the request in the node's Canton Coin wallet. The fund manager settles, and the LP's notice shows verified funded once the read-back step confirms it. DRAW's server learns only the LP's party id and never receives its token. In the newest runs the server's only ledger credential was a backend client with rights on the five demo parties and nothing else, so nothing the server held could act for the LP's party."
    status: devnet_verified
    environments: [devnet]
    evidence:
      - evidence/devnet/browser/web-hackcanton-20261006132613/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261006132730/result.json
      - evidence/devnet/probes/20261006T133219Z/result.json
      - evidence/devnet/browser/web-hackcanton-20261006100912/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261006101052/result.json
      - evidence/devnet/browser/web-hackcanton-20261006111458/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261006111654/result.json
      - evidence/devnet/browser/web-hackcanton-wallet-20261006114558/result.json
    limits: "The two newest runs record the site's setup: the demo seats on the backend client, no separate verifier, and DRAW's own Keycloak client for sign-in. The backend client's rights come from probe 20261006T133219Z, which records its check passing and the verifier client's failing, and the team's personal login was removed from the server before those runs. Earlier runs used a server that also held the team's personal login, which could act for the LP's party. Every run signed in with the team's own login as the LP, so the same person held both sides, though with different credentials in the newest runs. The verifier client NODERS issued can also act for that personal party, so it is not on the server. The LP's party is its login's wallet party, on the same NODERS participant as the fund, which has DRAW's package vetted. The token stays in the browser tab's session storage. The first four runs signed in through NODERS' public web-app client, the later ones through DRAW's own client. The runs from 11:14 UTC on are on the release where Sign out also ends the Keycloak session and every sign-in asks for the password."

  - id: grofty
    text: "An LP funds an obligation through Grofty on MainNet."
    status: blocked
    environments: []
    evidence: []
    blocker: out of scope this pass, see docs/DECISIONS.md D-001

  - id: generalization
    text: "Across 100 seeded capital calls on LocalNet (191 obligations), nothing was falsely funded, no party saw another's records, no replay was accepted, and every admin total matched an independent reference model."
    status: local_verified
    environments: [localnet]
    evidence: [evidence/local/campaign/20261002T193724Z/result.json]
    limits: "One to three LPs per call. Expired allocations and mid-payment network failures not generated."

  - id: canton-load-bearing
    text: "On LocalNet, the same call on an operator database with a paid flag lets four of five attacks through. On DRAW the ledger refuses all five."
    status: local_verified
    environments: [localnet]
    evidence: [evidence/local/ablation/20261002T193830Z/result.json]
    limits: "The database attacker has write access, as an operator or a compromised app server would. The transparent-ledger comparison is field exposure only, not a run."

  - id: browser-journey
    text: "The full journey runs in a browser against the real app and ledger: issue, two LPs pay, a wrong amount is refused, the unpaid LP goes overdue, other parties see nothing. In non-custodial mode every person creates an account with a key in the browser and approves every action in a Sign dialog."
    status: local_verified
    environments: [localnet]
    evidence: [evidence/local/browser/20261004T183631Z, evidence/local/browser/20261004T184730Z, evidence/local/browser/web-journey-20261005003621/result.json, evidence/local/browser/web-browser-keys-20261005005304/result.json]
    limits: "LocalNet. The wrong-amount and overdue steps ran in the 2026-10-04 runs on the earlier Vite web app. The two runs early on 2026-10-05 used the first Next.js web app, before that day's redesign, and cover issue, pay, the privacy check, settle, and verified funded. The redesigned onboarding and browser-key flow have not run on LocalNet. In the browser demo all roles' keys sit in the same browser so one person can play every role."

  - id: web-journey-devnet
    text: "The deployed web app runs a capital call end to end on DevNet: each person takes a seat at onboarding, the fund manager issues a call, LP A pays its notice, LP B opening LP A's notice link gets nothing, the fund manager settles, and LP A sees it verified funded. Each browser gets its own demo fund, so a second browser starts without one."
    status: devnet_verified
    environments: [devnet]
    evidence:
      - evidence/devnet/browser/web-20261005003221/result.json
      - evidence/devnet/browser/web-journey-20261005214111/result.json
      - evidence/devnet/browser/web-journey-20261006091011/result.json
      - evidence/devnet/browser/web-journey-20261006101224/result.json
      - evidence/devnet/browser/web-journey-20261006132858/result.json
    limits: "Shared hackathon login on the NODERS node, so one credential acts for every demo party, and the read-back step uses that same login. Actions on the public site need an access code. The second run is on the redesigned web app, the third adds a demo fund per browser, the fourth ran on the release with sign-in, and the fifth ran with the demo seats on the backend client NODERS issued for DRAW. The demo funds share the same five parties, so keeping one browser out of another's fund is the app's doing, while keeping each LP out of the others' records is the ledger's."

  - id: non-custodial
    text: "Each party can hold its own signing key: the participant prepares each transaction, the party's key signs it, and the participant cannot act for the party without that signature. Another party's key is refused. The scripted run passed 76 of 76 checks."
    status: local_verified
    environments: [localnet]
    evidence: [evidence/local/runs/20261004T183146Z/result.json]
    limits: "LocalNet only. DevNet LPs don't hold their own keys. On the HackCanton DevNet node, allocating an external party takes a participant admin, an identity provider admin, or the self path, whose quota defaults to 0 in Canton 3.5. An allocate call with our team login was refused with HTTP 403 (evidence/devnet/probes/20261006T091205Z/result.json), while generate-topology and interactive prepare work for that login. Keys in the scripted run are held by the run itself, one per party. In the web app each person creates a key in the browser, backs it up, and signs every action (evidence/local/browser/web-browser-keys-20261005005304). The hosting participant still validates and confirms each transaction."
