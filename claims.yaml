  - id: generalization
    text: "Across 100 seeded capital calls on LocalNet (191 obligations), nothing was falsely funded, no party saw another's records, no replay was accepted, and every admin total matched an independent reference model."
    status: local_verified
    environments: [localnet]
    evidence: [evidence/local/campaign/20261002T193724Z/result.json]
    limits: "One to three LPs per call. Expired allocations and mid-payment network failures not generated."

  - id: canton-load-bearing
    text: "On LocalNet, the same call on an operator database with a paid flag lets four of five attacks through. On DRAW the ledger refuses all five."
    status: local_verified
    environments: [localnet]
    evidence: [evidence/local/ablation/20261002T193830Z/result.json]
    limits: "The database attacker has write access, as an operator or a compromised app server would. The transparent-ledger comparison is field exposure only, not a run."

  - id: browser-journey
    text: "The full journey runs in a browser against the real app and ledger: issue, two LPs pay, a wrong amount is refused, the unpaid LP goes overdue, other parties see nothing. In non-custodial mode every person creates an account with a key in the browser and approves every action in a Sign dialog."
    status: local_verified
    environments: [localnet]
    evidence: [evidence/local/browser/20261004T183631Z, evidence/local/browser/20261004T184730Z, evidence/local/browser/web-journey-20261005003621/result.json, evidence/local/browser/web-browser-keys-20261005005304/result.json]
    limits: "LocalNet. The wrong-amount and overdue steps ran in the 2026-10-04 runs on the earlier Vite web app. The two runs early on 2026-10-05 used the first Next.js web app, before that day's redesign, and cover issue, pay, the privacy check, settle, and verified funded. The redesigned onboarding and browser-key flow have not run on LocalNet. In the browser demo all roles' keys sit in the same browser so one person can play every role."

  - id: web-journey-devnet
    text: "The deployed web app runs a capital call end to end on DevNet: each person takes a seat at onboarding, the fund manager issues a call, LP A pays its notice, LP B opening LP A's notice link gets nothing, the fund manager settles, and LP A sees it verified funded. Each browser gets its own demo fund, so a second browser starts without one."
    status: devnet_verified
    environments: [devnet]
    evidence:
      - evidence/devnet/browser/web-20261005003221/result.json
      - evidence/devnet/browser/web-journey-20261005214111/result.json
      - evidence/devnet/browser/web-journey-20261006091011/result.json
      - evidence/devnet/browser/web-journey-20261006101224/result.json
      - evidence/devnet/browser/web-journey-20261006132858/result.json
      - evidence/devnet/browser/web-journey-20261007015754/result.json
      - evidence/devnet/browser/web-journey-20261007130359/result.json
      - evidence/devnet/browser/web-journey-20261007205208/result.json
    limits: "One credential acts for every demo party: the shared hackathon login in the first four runs, and the backend client NODERS issued for DRAW in the fifth to eighth. The read-back step used that same credential in the first six runs, and a client of its own that only reads as the fund in the seventh and eighth. Actions on the public site need an access code. The second run is on the redesigned web app, the third adds a demo fund per browser, the fourth ran on the release with sign-in, the fifth ran with the demo seats on the backend client NODERS issued for DRAW, the sixth on the release whose screens say the read-back runs on that same login, the seventh with the read-back on its own client, and the eighth the same on the drawcalls.xyz domain, the other seven on the site's workers.dev address. The demo funds share the same five parties, so keeping one browser out of another's fund is the app's doing, while keeping each LP out of the others' records is the ledger's."

  - id: non-custodial
    text: "Each party can hold its own signing key: the participant prepares each transaction, the party's key signs it, and the participant cannot act for the party without that signature. Another party's key is refused. The scripted run passed 76 of 76 checks."
    status: local_verified
    environments: [localnet]
    evidence: [evidence/local/runs/20261004T183146Z/result.json]
    limits: "LocalNet. The DevNet run with external parties is the devnet-own-keys claim. On the HackCanton DevNet node a tenant can't allocate external parties itself: allocating one takes a participant admin, an identity provider admin, or the self path, whose quota defaults to 0 in Canton 3.5, and an allocate call with our team login was refused with HTTP 403 (evidence/devnet/probes/20261006T091205Z/result.json). NODERS allocated them for us. Keys in the scripted run are held by the run itself, one per party. In the web app each person creates a key in the browser, backs it up, and signs every action (evidence/local/browser/web-browser-keys-20261005005304). The hosting participant still validates and confirms each transaction."

  - id: devnet-own-keys
    text: "On the HackCanton DevNet node, the full capital call runs with five external parties, the fund, three LPs and an unrelated party, each signing its own transactions with its own Ed25519 key, passing 83 of 83 checks on package 0.3.0. The node prepares each transaction and the acting party's key signs it. The run's login was refused when it tried to act for LP A without LP A's key, and LP B's key was refused when it tried to sign for LP A. Each LP tapped its test Canton Coin, LP A paid by creating its allocation from its payment request, and the fund settled both payments, each step signed by the acting party's own key. Both settlements read back as verified funded with 14-check receipts, and the bad-payment, deadline, totals and privacy checks passed as in the devnet claim."
    status: devnet_verified
    environments: [devnet]
    evidence:
      - evidence/devnet/runs/20261007T130259Z/result.json
      - evidence/devnet/runs/20261007T130259Z/receipt-lpA.json
      - evidence/devnet/runs/20261007T130259Z/receipt-lpB.json
      - evidence/devnet/runs/20261007T130259Z/streams.json
      - evidence/devnet/runs/20261007T130259Z/totals.json
    limits: "NODERS allocated the five parties on 2026-10-07 from onboarding transactions DRAW generated and signed. All five keys sat on the machine that ran the script, as in the LocalNet run, so the run shows the ledger needs each party's signature, not that separate people held the keys. One login, the team's own, submitted for every party and read each settlement back, so LP-from-LP credential separation and a read-back login of its own were skipped with the reasons recorded. The live site still signs for its demo seats through the backend client. The first attempt, run 20261007T130036Z, stopped at the read-back, because the verifier client may read only as the regular fund party and not as the external one."
